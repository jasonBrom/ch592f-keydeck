name: Build and release firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag; leave empty for a development prerelease'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate version and pin the source commit
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python3 scripts/firmware_release.py prepare

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  package:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: KeyDeck-CH592F-haptic
          path: firmware/build/haptic
      - uses: actions/download-artifact@v4
        with:
          name: KeyDeck-CH592F-no-haptic
          path: firmware/build/no-haptic
      - name: Package both variants and record SHA-256 checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 scripts/firmware_release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-firmware-release
          path: release-dist/*
          if-no-files-found: error
      - name: Summarize firmware files
        run: cat release-dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyDeck-firmware-release
          path: release-dist
      - name: Verify the downloaded release bundle
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish the complete firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--title "KeyDeck CH592F $RELEASE_TAG" --notes-file release-dist/release-notes.md)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--prerelease=false --latest)
          fi
          assets=(release-dist/*.hex release-dist/*.bin release-dist/*.zip
                  release-dist/manifest.json release-dist/SHA256SUMS.txt release-dist/firmware-guide.md)
          # Stable tags are already present; development tags are created by the draft below.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-draft; then
            actual_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            [[ "$actual_commit" == "$RELEASE_COMMIT" ]] || { echo 'Tag moved; refusing to publish.'; exit 1; }
            # Published assets stay immutable. A failed draft upload can be resumed.
            if [[ "$(cat existing-draft)" == false ]]; then
              echo "Release $RELEASE_TAG is already published; keeping its assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft "${args[@]}"
          fi
          # Check both annotated and lightweight tags resolve to the compiled commit.
          actual_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          [[ "$actual_commit" == "$RELEASE_COMMIT" ]] || { echo 'Tag moved; refusing to publish.'; exit 1; }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
